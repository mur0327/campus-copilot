[project]
name = "campus-copilot-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Scheduler
    "apscheduler>=3.11.0",
    # Crawling
    "crawl4ai>=0.8.6",
    "curl-cffi>=0.15.0",
    "beautifulsoup4>=4.13.4",
    # PDF
    "langchain-opendataloader-pdf>=2.0.0",
    # Embedding
    "sentence-transformers>=5.3.0",
    "chromadb==1.5.8",
    "rank-bm25>=0.2.2",
    # DB
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    # Settings
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
