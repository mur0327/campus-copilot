<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Shared observation band -->
  <rect x="30" y="26" width="860" height="60" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="460" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">One question under the frozen corpus and final qrel</text>
  <text x="460" y="72" text-anchor="middle" font-size="11" fill="#333">retrieval comparison runs (RQ1, Best Bets off) and the operational final-response run (Best Bets on) are separate observations</text>

  <!-- Four lenses -->
  <!-- Lens a -->
  <line x1="140" y1="86" x2="140" y2="120" stroke="#222" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <rect x="40" y="124" width="200" height="156" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">(a) Page and chunk retrieval</text>
  <line x1="56" y1="158" x2="224" y2="158" stroke="#999" stroke-width="1"/>
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#333">page support in top-5</text>
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#333">full / partial / invalid</text>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#333">chunk evidence grade</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#333">full / partial / unsupported</text>

  <!-- Lens b -->
  <line x1="360" y1="86" x2="360" y2="120" stroke="#222" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <rect x="260" y="124" width="200" height="156" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">(b) Content and grounding</text>
  <line x1="276" y1="158" x2="444" y2="158" stroke="#999" stroke-width="1"/>
  <text x="360" y="178" text-anchor="middle" font-size="11" fill="#333">content accuracy</text>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#333">claim support by injected evidence</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#333">correctness of displayed sources</text>

  <!-- Lens c -->
  <line x1="580" y1="86" x2="580" y2="120" stroke="#222" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <rect x="480" y="124" width="200" height="156" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="580" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">(c) Deployment fit</text>
  <line x1="496" y1="158" x2="664" y2="158" stroke="#999" stroke-width="1"/>
  <text x="580" y="178" text-anchor="middle" font-size="11" fill="#333">temporal deployability (page)</text>
  <text x="580" y="196" text-anchor="middle" font-size="11" fill="#333">claim temporal validity (response)</text>
  <text x="580" y="222" text-anchor="middle" font-size="11" fill="#333">audience fit</text>
  <text x="580" y="240" text-anchor="middle" font-size="11" fill="#333">privacy</text>

  <!-- Lens d -->
  <line x1="800" y1="86" x2="800" y2="120" stroke="#222" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <rect x="700" y="124" width="190" height="156" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="795" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">(d) Behavior policy</text>
  <line x1="716" y1="158" x2="874" y2="158" stroke="#999" stroke-width="1"/>
  <text x="795" y="178" text-anchor="middle" font-size="11" fill="#333">expected vs. actual:</text>
  <text x="795" y="196" text-anchor="middle" font-size="11" fill="#333">full / qualified / abstain</text>
  <text x="795" y="222" text-anchor="middle" font-size="11" fill="#333">conservative policy</text>
  <text x="795" y="240" text-anchor="middle" font-size="11" fill="#333">predefined for the audit</text>

  <!-- Bottom note -->
  <rect x="30" y="304" width="860" height="60" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="460" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Each lens is judged separately; (a) and page-side deployability feed the qrel and RQ1 retrieval metrics.</text>
  <text x="460" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Strict composite success: behavior match (clear notice when abstaining) + content, grounding, and response-side deployment all pass.</text>
  <text x="460" y="360" text-anchor="middle" font-size="11" fill="#333">In this case study, content, grounding, and deployment failures formed distinct question sets with limited three-way overlap.</text>
</svg>
