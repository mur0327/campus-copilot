[project]
name = "campus-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    # DB
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    # Settings
    "pydantic-settings>=2.13.1",
    # Redis cache
    "aiocache[redis]>=0.12.3",
    # HTTP client
    "httpx>=0.28.1",
    # RAG
    "chromadb==1.5.8",
    "sentence-transformers>=5.4.0",
    "rank-bm25>=0.2.2",
    # LLM
    "google-genai>=1.33.0",
    "ollama>=0.6.1",
    # SSE
    "sse-starlette>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
